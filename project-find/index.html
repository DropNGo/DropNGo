<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project Find — Auto Research</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f6f3;color:#111;font:15px system-ui,-apple-system,Segoe UI,sans-serif}main{max-width:1000px;margin:auto;padding:28px 18px 70px}.top{display:flex;justify-content:space-between;margin-bottom:80px}.logo{font-weight:900;letter-spacing:-.05em;font-size:21px}.tag{border:1px solid #ddd;border-radius:999px;padding:7px 11px;color:#666;background:#fff;font-size:12px}.hero{text-align:center}.hero h1{font-size:clamp(42px,7vw,76px);line-height:.95;letter-spacing:-.07em;margin:0 0 18px}.hero p{color:#666;max-width:650px;margin:0 auto 28px;line-height:1.55;font-size:17px}.search{display:flex;background:#fff;border:1px solid #ddd;border-radius:22px;padding:9px;box-shadow:0 12px 40px #0000000b}.search textarea{flex:1;border:0;outline:0;resize:none;padding:14px;font:inherit;min-height:54px}.search button{border:0;background:#111;color:white;border-radius:15px;padding:0 23px;font-weight:800}.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}.chip{background:#fff;border:1px solid #ddd;border-radius:999px;padding:9px 12px;color:#555}.panel{display:none;margin-top:32px}.panel.show{display:block}.box,.car{background:#fff;border:1px solid #e2e2dd;border-radius:20px}.box{padding:20px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:15px}.pill{border:1px solid #e4e4df;border-radius:14px;padding:11px}.pill small{display:block;color:#888;font-size:10px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0}.step{padding:11px;border:1px solid #ddd;border-radius:12px;background:white;font-size:12px;color:#555}.results-title{margin:25px 0 12px;font-size:25px;letter-spacing:-.03em}.car{display:grid;grid-template-columns:155px 1fr auto;gap:16px;padding:16px;margin:10px 0}.car img{width:155px;height:110px;object-fit:cover;border-radius:14px;background:#eee}.rank{font-size:11px;color:#777}.name{font-size:19px;font-weight:800;margin:3px 0 8px}.specs{display:flex;flex-wrap:wrap;gap:6px}.spec{font-size:12px;border:1px solid #ddd;border-radius:999px;padding:5px 8px;color:#555}.why{margin-top:9px;color:#666;font-size:13px;line-height:1.45}.price{font-weight:900;font-size:20px;white-space:nowrap}.source{font-size:10px;color:#999;margin-top:8px}.near{margin-top:25px}.nearbox{padding:18px;background:#fff;border:1px dashed #ccc;border-radius:18px;color:#555;line-height:1.55}@media(max-width:700px){.top{margin-bottom:55px}.search{display:block}.search button{height:50px;width:100%;margin-top:5px}.grid,.steps{grid-template-columns:1fr 1fr}.car{grid-template-columns:1fr}.car img{width:100%;height:180px}.price{margin-top:-5px}}@media(max-width:430px){.grid,.steps{grid-template-columns:1fr}}</style></head><body><main><div class="top"><div class="logo">PROJECT FIND</div><div class="tag">AUTO RESEARCH · MVP</div></div><section class="hero"><h1>Was suchst du wirklich?</h1><p>Schreib es einfach so, wie du es einem Freund sagen würdest. Wir zerlegen die Anfrage, prüfen den Markt und ranken die Treffer — ohne Filter-Hölle.</p><div class="search"><textarea id="q" placeholder="z. B. Kia Stinger Diesel, unter 20.000 €, ab 2018..."></textarea><button onclick="run()">Finden</button></div><div class="chips"><button class="chip" onclick="demo(this)">Kia Stinger Diesel unter 20k</button><button class="chip" onclick="demo(this)">Mercedes Coupé Diesel ab 2015 unter 15k</button><button class="chip" onclick="demo(this)">BMW 440i unter 25k, unter 120.000 km</button></div></section><section id="panel" class="panel"><div class="box"><b>Ich habe deine Anfrage verstanden</b><div id="criteria" class="grid"></div><p id="smart" style="color:#666"></p></div><div id="steps" class="steps"></div><h2 id="resultTitle" class="results-title">Treffer</h2><div id="results"></div><div id="near" class="near"></div></section></main><script>const cars=[{n:'Kia Stinger 2.2 CRDi GT Line',y:2018,p:200,f:'Diesel',pr:21990,k:142000,t:'Automatik',m:95,img:'https://images.unsplash.com/photo-1542282088-72c9c27ed0cd?auto=format&fit=crop&w=700&q=80'},{n:'Kia Stinger 2.2 CRDi',y:2019,p:200,f:'Diesel',pr:24900,k:118000,t:'Automatik',m:91,img:'https://images.unsplash.com/photo-1552519507-da3b142c6e3d?auto=format&fit=crop&w=700&q=80'},{n:'Mercedes E 350 CDI Coupé',y:2016,p:258,f:'Diesel',pr:14990,k:156000,t:'Automatik',m:88,img:'https://images.unsplash.com/photo-1553440569-bcc63803a83d?auto=format&fit=crop&w=700&q=80'},{n:'BMW 440i xDrive Coupé',y:2017,p:326,f:'Benzin',pr:23990,k:119000,t:'Automatik',m:94,img:'https://images.unsplash.com/photo-1555215695-3004980ad54e?auto=format&fit=crop&w=700&q=80'}];function parse(q){let x=q.toLowerCase(),m=x.match(/(?:unter|max(?:imal)?|bis)\s*([\d.,]+)\s*(k|€)?/),price=m?Number(m[1].replace(/\./g,'').replace(',','.'))*(m[2]=='k'?1000:1):null,year=(x.match(/(?:ab|seit)\s*(20\d{2})/)||[])[1],power=(x.match(/(?:mindestens|min)\s*(\d+)\s*ps/)||[])[1],km=(x.match(/(?:unter|max(?:imal)?|höchstens)\s*([\d.]+)\s*km/)||[])[1],brand=x.includes('kia')?'Kia':x.includes('bmw')?'BMW':x.includes('mercedes')?'Mercedes':'',fuel=x.includes('diesel')?'Diesel':x.includes('benzin')?'Benzin':'',body=x.includes('coup')?'Coupé':'';return{price,year:+year||0,power:+power||0,km:km?+km.replace('.',''):0,brand,fuel,body}}function run(){let q=document.getElementById('q').value.trim();if(!q)return;let p=parse(q),panel=document.getElementById('panel');panel.classList.add('show');let a=[];if(p.brand)a.push(['Marke',p.brand]);if(p.fuel)a.push(['Kraftstoff',p.fuel]);if(p.body)a.push(['Karosserie',p.body]);if(p.year)a.push(['Baujahr',p.year+'+']);if(p.power)a.push(['Leistung',p.power+' PS+']);if(p.price)a.push(['Budget','≤ '+p.price.toLocaleString('de-DE')+' €']);if(p.km)a.push(['Kilometer','≤ '+p.km.toLocaleString('de-DE')+' km']);document.getElementById('criteria').innerHTML=(a.length?a:[['Anfrage','Freie Suche']]).map(v=>`<div class="pill"><small>${v[0]}</small>${v[1]}</div>`).join('');let exact=cars.filter(c=>(!p.brand||c.n.toLowerCase().includes(p.brand.toLowerCase()))&&(!p.fuel||c.f===p.fuel)&&(!p.body||c.n.includes(p.body))&&(!p.year||c.y>=p.year)&&(!p.power||c.p>=p.power)&&(!p.price||c.pr<=p.price)&&(!p.km||c.k<=p.km)).sort((a,b)=>b.m-a.m);document.getElementById('smart').innerHTML=p.brand==='Kia'&&p.price&&p.price<18000?'🧠 <b>Marktrealität:</b> Dieses Budget ist wahrscheinlich zu knapp. Ich suche deshalb nicht blind weiter, sondern zeige dir auch passende Fahrzeuge über Budget.':'';document.getElementById('steps').innerHTML=['Anfrage verstanden','Kriterien extrahiert','Markt plausibilisiert','Angebote geprüft','Ranking'].map(s=>`<div class="step">✓ ${s}</div>`).join('');document.getElementById('resultTitle').textContent=exact.length?`${exact.length} passende Treffer`:'Keine perfekten Treffer';document.getElementById('results').innerHTML=exact.map(card).join('');let near=cars.filter(c=>!exact.includes(c)&&(!p.brand||c.n.toLowerCase().includes(p.brand.toLowerCase()))&&(!p.fuel||c.f===p.fuel));document.getElementById('near').innerHTML=near.length?'<h3>Beinahe-Treffer</h3><div class="nearbox">'+near.map(c=>`<b>${c.n}</b> — ${c.pr.toLocaleString('de-DE')} €, ${c.y}, ${c.p} PS. ${p.price&&c.pr>p.price?`${(c.pr-p.price).toLocaleString('de-DE')} € über Budget.`:'Nur einzelne Kriterien verfehlt.'}`).join('<br><br>')+'</div>':''}function card(c,i){return `<article class="car"><img src="${c.img}" alt="Fahrzeug"><div><div class="rank">#${i+1} · ${c.m}% Passung</div><div class="name">${c.n}</div><div class="specs"><span class="spec">${c.y}</span><span class="spec">${c.p} PS</span><span class="spec">${c.f}</span><span class="spec">${c.k.toLocaleString('de-DE')} km</span><span class="spec">${c.t}</span></div><div class="why"><b>Warum:</b> Die wichtigsten Muss-Kriterien passen. Später wird hier automatisch die Originalbeschreibung des echten Händlers kurz analysiert.</div><div class="source">Demo-Angebot · noch nicht live verifiziert</div></div><div class="price">${c.pr.toLocaleString('de-DE')} €</div></article>`}function demo(b){document.getElementById('q').value=b.textContent;run()}</script></body></html>
